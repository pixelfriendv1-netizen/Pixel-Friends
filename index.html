<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Friends</title>
</head>
<body>

  <h1>Pixel Friends</h1>
  <p>Real-time chat & notifications</p>

  <!-- Supabase & Web Push Implementation -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // 1. Supabase Client Setup
    const SUPABASE_URL = 'https://koljxgkatllfexwoxnfi.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Base64 URL to Uint8Array converter for VAPID Key
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // 3. Register Service Worker and subscribe user to push
    export async function subscribeUserToPush(userId) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        console.warn('Push messaging is not supported in this browser.');
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        const permission = await Notification.requestPermission();
        
        if (permission !== 'granted') {
          console.warn('Notification permission not granted.');
          return;
        }

        const VAPID_PUBLIC_KEY = 'BIVFWH78Xnr9zCgQkvsSB2lXmWDt2Tf-rRa1WRNSyQQfhZRXL16f2MPmwKNAeaj29gREr5R_WxSG20IIvmaQAnI';

        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });

        // Save subscription object to push_subscriptions table
        const { error } = await supabase.from('push_subscriptions').upsert({
          user_id: userId,
          subscription: subscription.toJSON(),
        });

        if (error) throw error;

        console.log('Push subscription activated successfully!');
      } catch (err) {
        console.error('Push registration error:', err);
      }
    }

    // 4. Auto-trigger on page load if user is logged in
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        await subscribeUserToPush(session.user.id);
      }
    }

    init();
  </script>
</body>
</html>
