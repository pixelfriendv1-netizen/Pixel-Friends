<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Friends</title>
    <!-- Load Supabase v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #1877f2; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #166fe5; }
        .post-card { background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 6px; }
        .post-header { font-weight: bold; margin-bottom: 5px; color: #555; font-size: 0.9em; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .actions button { background: #e4e6eb; color: #333; width: auto; padding: 6px 12px; font-size: 0.85em; }
        .comments-section { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; font-size: 0.9em; }
        .comment-item { background: #f0f2f5; padding: 6px 10px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pixel Friends 🐾</h2>

    <!-- AUTH SECTION -->
    <div id="auth-section">
        <h3>Login / Sign Up</h3>
        <input type="email" id="email" placeholder="Email address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleSignUp()">Sign Up</button>
        <button onclick="handleLogin()">Log In</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <!-- APP SECTION -->
    <div id="app-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <p id="user-display" style="font-weight: bold;"></p>
            <button onclick="handleLogout()" style="width: auto; background: #e4e6eb; color: #333;">Log Out</button>
        </div>

        <hr>

        <h3>Create Post</h3>
        <textarea id="post-content" placeholder="What's on your mind?"></textarea>
        <button onclick="createPost()">Publish Post</button>

        <h3>Feed</h3>
        <div id="feed-container"></div>
    </div>
</div>

<script>
    // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            showApp();
            loadPosts();
            setupRealtime();
        } else {
            showAuth();
        }
    }

    async function handleSignUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) document.getElementById('auth-error').textContent = error.message;
        else alert('Check your email for confirmation link or try logging in if email confirmation is disabled.');
    }

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('auth-error').textContent = error.message;
        } else {
            currentUser = data.user;
            showApp();
            loadPosts();
            setupRealtime();
        }
    }

    async function handleLogout() {
        await supabase.auth.signOut();
        currentUser = null;
        showAuth();
    }

    function showAuth() {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
    }

    function showApp() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-display').textContent = `Logged in as: ${currentUser.email}`;
    }

    async function createPost() {
        const content = document.getElementById('post-content').value;
        if (!content.trim()) return;

        const { error } = await supabase.from('posts').insert([
            { content: content, user_id: currentUser.id, likes_count: 0 }
        ]);

        if (error) {
            alert('Error creating post: ' + error.message);
        } else {
            document.getElementById('post-content').value = '';
        }
    }

    async function loadPosts() {
        const { data: posts, error } = await supabase
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Error loading posts:', error);
            return;
        }

        const container = document.getElementById('feed-container');
        container.innerHTML = '';
        posts.forEach(post => renderPost(post));
    }

    function renderPost(post) {
        const container = document.getElementById('feed-container');
        
        // Prevent duplicate rendering if already in DOM
        if (document.getElementById(`post-${post.id}`)) return;

        const postEl = document.createElement('div');
        postEl.className = 'post-card';
        postEl.id = `post-${post.id}`;
        postEl.innerHTML = `
            <div class="post-header">User: ${post.user_id.substring(0, 8)}...</div>
            <p>${post.content}</p>
            <div class="actions">
                <button onclick="likePost('${post.id}', ${post.likes_count || 0})">❤️ Likes (<span id="likes-${post.id}">${post.likes_count || 0}</span>)</button>
            </div>
            <div class="comments-section">
                <div id="comments-list-${post.id}"></div>
                <input type="text" id="comment-input-${post.id}" placeholder="Write a comment...">
                <button onclick="addComment('${post.id}')" style="margin-top:4px;">Post Comment</button>
            </div>
        `;
        container.prepend(postEl);
        loadCommentsForPost(post.id);
    }

    async function likePost(postId, currentLikes) {
        const { error } = await supabase
            .from('posts')
            .update({ likes_count: currentLikes + 1 })
            .eq('id', postId);

        if (error) console.error('Error updating like:', error);
    }

    async function addComment(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input.value;
        if (!text.trim()) return;

        const { error } = await supabase.from('comments').insert([
            { post_id: postId, user_id: currentUser.id, content: text }
        ]);

        if (error) alert('Error posting comment: ' + error.message);
        else input.value = '';
    }

    async function loadCommentsForPost(postId) {
        const { data: comments } = await supabase
            .from('comments')
            .select('*')
            .eq('post_id', postId)
            .order('created_at', { ascending: true });

        if (comments) {
            const listEl = document.getElementById(`comments-list-${postId}`);
            listEl.innerHTML = '';
            comments.forEach(c => {
                const cEl = document.createElement('div');
                cEl.className = 'comment-item';
                cEl.innerHTML = `<b>${c.user_id.substring(0, 6)}:</b> ${c.content}`;
                listEl.appendChild(cEl);
            });
        }
    }

    // REALTIME SUBSCRIPTIONS
    function setupRealtime() {
        // 1. Listen for new posts and post updates (likes)
        supabase.channel('public:posts')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, (payload) => {
                renderPost(payload.new);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'posts' }, (payload) => {
                const likeSpan = document.getElementById(`likes-${payload.new.id}`);
                if (likeSpan) {
                    likeSpan.textContent = payload.new.likes_count;
                }
            })
            .subscribe();

        // 2. Listen for new comments
        supabase.channel('public:comments')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
                loadCommentsForPost(payload.new.post_id);
            })
            .subscribe();
    }

    // Run initialization on load
    init();
</script>

</body>
</html>
